[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "geojson2kml"
authors = [{ name = "Alex Guinman", email = "alex@guinman.id.au" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
]
keywords = ["geojson", "KML"]
requires-python = ">=3.10"
dynamic = ["version", "description"]
dependencies = ["typer", "simplekml", "geojson"]

[project.optional-dependencies]
test = ["pytest >=2.7.3", "pytest-cov"]

[project.urls]
Source = "https://github.com/aguinane/geojson-to-kml"

[project.scripts]
nemreader = "geojson2kml.cli:app"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-ra --failed-first --showlocals --durations=3 --cov=geojson2kml"

[tool.coverage.run]
omit = ["*/version.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "PERF", "RUF", "SIM", "UP"]
ignore = ["A002", "B008"]